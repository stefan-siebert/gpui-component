[workspace]
default-members = ["crates/story"]
members = [
    "crates/kit",
    "crates/base",
    "crates/base/examples/wasm",
    "crates/base/examples/native",
    "crates/component-macros",
    "crates/story",
    "crates/story-web",
    "crates/component",
    "crates/assets",
    "crates/fps",
    "crates/webview",
    "examples/app_assets",
    "examples/fps_monitor",
    "examples/hello_world",
    "examples/input",
    "examples/editor",
    "examples/syntect",
    "examples/tig",
    "examples/brush",
    "examples/dock",
    "examples/html",
    "examples/large-text",
    "examples/markdown",
    "examples/stream-markdown",
    "examples/window_title",
    "examples/dialog_overlay",
    "examples/webview",
    "examples/system_monitor",
    "examples/focus_trap",
    "examples/tooltip_top_edge",
    "examples/sidebar",
    "examples/text_max_lines",
    "examples/text_selection",
    "examples/touch_selection",
    "examples/table_in_scrollable",
    "examples/markdown_table",
    "examples/ai_recipes",
    "examples/speech",
    "crates/shell",
    "crates/shell/rquickjs-compat",
]
resolver = "2"

[workspace.package]
publish = false
edition = "2024"

[workspace.dependencies]
gpui-kit = { path = "crates/kit", version = "0.8.0" }
gpui-component = { path = "crates/component", version = "0.8.0" }
gpui-base = { path = "crates/base", version = "0.8.0" }
gpui-component-macros = { path = "crates/component-macros", version = "0.8.0" }
gpui-kit-assets = { path = "crates/assets", version = "0.8.0" }
gpui-fps = { path = "crates/fps", version = "0.8.0" }
gpui-shell = { path = "crates/shell", version = "0.8.0" }
gpui-webview = { path = "crates/webview", version = "0.8.0" }
story = { path = "crates/story" }
# Git, not a sibling path: a consumer that pulls this crate by git (speedy)
# must be able to resolve the `mcp` feature without a ../gpui-mcp checkout.
# The [patch] below keeps local work on the sibling checkout.
gpui-mcp-protocol = { package = "gpui-mcp-inspector", git = "https://github.com/stefan-siebert/gpui-mcp", branch = "main" }

# This fork's gpui, not zed-industries': the branch carries the patches
# gpui-component's `mcp` feature and Elane both depend on (../gpui-fork,
# FORK_CHANGES.md). No `version` pin — the fork's branch is the contract.
gpui = { git = "https://github.com/stefan-siebert/zed", branch = "gpui-mcp-patches-v2" }
gpui_platform = { git = "https://github.com/stefan-siebert/zed", branch = "gpui-mcp-patches-v2", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui_web = { git = "https://github.com/stefan-siebert/zed", branch = "gpui-mcp-patches-v2" }
# Upstream's optional gpui-fast backend (crates.io). Elane never enables
# it; kept so the feature wiring across the crates stays upstream's.
# Fast is optional; existing crates select it through their gpui-fast feature.
# Explicit package fields make Cargo use these dependency keys as Rust crate names;
# the packages declare the same library names as the pre backend.
gpui-fast = { package = "gpui-fast", version = "0.1.10", features = ["windows-manifest-provided-by-host"] }
gpui-fast-platform = { package = "gpui-fast-platform", version = "0.1.10", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-fast-web = { package = "gpui-fast-web", version = "0.1.10" }
gpui_macros = { git = "https://github.com/stefan-siebert/zed", branch = "gpui-mcp-patches-v2" }
reqwest_client = { git = "https://github.com/stefan-siebert/zed", branch = "gpui-mcp-patches-v2" }
sum-tree = { version = "0.2.0", package = "zed-sum-tree" }
# reqwest = { version = "0.12.15-zed", package = "zed-reqwest" }
reqwest = { git = "https://github.com/zed-industries/reqwest.git", rev = "c15662463bda39148ba154100dd44d3fba5873a4", default-features = false, features = [
    "charset",
    "http2",
    "macos-system-configuration",
    "multipart",
    "rustls-tls-native-roots",
    "socks",
    "stream",
], package = "zed-reqwest", version = "0.12.15-zed" }

anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
instant = { version = "0.1", features = ["wasm-bindgen"] }
log = "0.4"
lsp-types = { version = "0.97.0", features = ["proposed"] }
notify = "8.2.0"
raw-window-handle = "0.6.2"
ropey = { version = "=2.0.0-beta.1", features = [
    "metric_chars",
    "metric_lines_lf",
    "metric_utf16",
] }
rust-i18n = "4.2.0"
schemars = "1"
semver = "1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
smallvec = "1"
smol = "2"
syntect = { version = "5.3.0", default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "regex-fancy",
] }
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"] }
tracing = "0.1.41"
wasm-bindgen = "0.2.113"
# Use errno stub for WASM
errno = { version = "0.3.14", default-features = false }

[workspace.dependencies.windows]
features = ["Wdk", "Wdk_System", "Wdk_System_SystemServices"]
# Unified with the gpui fork's windows version to avoid two windows crates in
# the dependency tree (and to provide the Option<HWND> Win32 API title_bar uses).
version = "0.62"

[workspace.lints.clippy]
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
style = { level = "allow", priority = -1 }
todo = "deny"
type_complexity = "allow"
# Temporarily allow this until we can migrate to the new APIs.
# https://github.com/longbridge/gpui-kit/pull/2149
useless_conversion = "allow"

# Keep Cargo's default of 256 codegen units. Incremental builds re-codegen
# whole units, so with 16 units a one-line change in gpui-component or
# gpui-base took about 50% more CPU to rebuild.
[profile.dev]
debug = "limited"
split-debuginfo = "unpacked"

# These speed up the debug application at run time; opt-level 1 rendered the
# `text_view_scroll` bench frames 22-25% slower to save about 9% of a clean
# build's CPU, and nothing on an incremental one. Proc-macro crates are left
# out: they only run inside the compiler, and expanding gpui's macros takes as
# long unoptimized, so optimizing them only adds compile time.
[profile.dev.package]
resvg = { opt-level = 3 }
# Screenshot scaling for the `mcp` feature runs through `image`. Unoptimised
# it costs a few hundred milliseconds per screenshot, which is the wrong place
# to spend a dev build's honesty.
image = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
smol = { opt-level = 3 }
gpui-pre = { opt-level = 3 }
gpui-fast = { opt-level = 3 }
gpui-fast-platform = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
tree-sitter = { opt-level = 3 }
gpui-pre-sum-tree = { opt-level = 3 }
ropey = { opt-level = 3 }
lsp-types = { opt-level = 3 }
gpui-pre-reqwest-client = { opt-level = 3 }
markdown = { opt-level = 3 }
xml5ever = { opt-level = 3 }
# `quickjs-jit` is a facade that re-exports `quickjs-jit-core`, so naming it alone
# optimises neither the interpreter nor the bindings. `quickjs-jit-sys` builds
# QuickJS itself through `cc`, which reads this package's opt-level; without
# these two a debug build spends roughly three times as long in every script
# render. See `website/shell/hosting.md`.
quickjs-jit = { opt-level = 3 }
quickjs-jit-runtime = { opt-level = 3 }
quickjs-jit-sys = { opt-level = 3 }
quickjs-jit-core = { opt-level = 3 }
cap-std = { opt-level = 3 }

# Stripping the symbol table costs no build time and removes about a quarter of
# a release binary (`gpui-shell`: 106 MB to 78 MB on Linux x86_64).
[profile.release]
strip = "symbols"

[patch.crates-io]
# LLRT's public modules still name their compatible binding dependency
# `rquickjs`. Route those dependencies through a source-compatible facade so
# the shell and LLRT share the exact same quickjs-jit types and VM.
rquickjs = { path = "crates/shell/rquickjs-compat" }
# Fork: stacker's psm, which may have better WASM support.
psm = { git = "https://github.com/rust-lang/stacker", branch = "master" }

[workspace.metadata.typos]
files.extend-exclude = ["**/fixtures/*"]

[workspace.metadata.typos.default.extend-identifiers]
consts = "consts"

[workspace.metadata.cargo-machete]
ignored = ["log", "anyhow", "serde"]

[patch."https://github.com/stefan-siebert/zed"]
gpui = { path = "../gpui-fork/crates/gpui" }
gpui_platform = { path = "../gpui-fork/crates/gpui_platform" }
gpui_macros = { path = "../gpui-fork/crates/gpui_macros" }
http_client = { path = "../gpui-fork/crates/http_client" }
reqwest_client = { path = "../gpui-fork/crates/reqwest_client" }

[patch."https://github.com/stefan-siebert/gpui-mcp"]
gpui-mcp-inspector = { path = "../gpui-mcp" }
